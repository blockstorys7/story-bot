name: 3D-Vorschau

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Systempakete
        timeout-minutes: 8
        run: |
          sudo apt-get update -q -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends ffmpeg libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1
      - name: Blender aus Zwischenspeicher
        id: bcache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-4.2.3
      - name: Blender herunterladen
        if: steps.bcache.outputs.cache-hit != 'true'
        timeout-minutes: 12
        run: |
          mkdir -p ~/blender
          for url in https://mirrors.ocf.berkeley.edu/blender/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz \
                     https://ftp.halifax.rwth-aachen.de/blender/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz \
                     https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz; do
            echo "Lade $url"
            if curl -fL --retry 2 --connect-timeout 20 --max-time 420 -o /tmp/b.tar.xz "$url"; then break; fi
          done
          tar -xJf /tmp/b.tar.xz -C ~/blender --strip-components=1
      - name: Blender prüfen
        timeout-minutes: 2
        run: |
          echo "$HOME/blender" >> $GITHUB_PATH
          ~/blender/blender -b --factory-startup -noaudio --version | head -3
      - run: pip install -q pillow
      - name: Probe-Bilder rendern
        run: time python tests/preview_shots.py
      - name: Bilder in Branch "preview" speichern
        run: |
          cd preview/img
          ffmpeg -v error -y -i shot_%02d.png -vf "scale=360:-1,tile=4x2" -frames:v 1 ../sheet.jpg || true
          cd ../..
          git config user.name "story-bot"; git config user.email "story-bot@users.noreply.github.com"
          git checkout --orphan preview-out
          git rm -rfq --cached .
          git add -f preview/img/*.png preview/sheet.jpg
          git commit -qm "3D-Vorschau"
          git push -f origin preview-out:preview
