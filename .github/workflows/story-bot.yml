name: Story Bot

on:
  schedule:
    # 4x täglich. Zeiten in UTC (Winter: deutsche Zeit -1 h). GitHub startet oft ein paar
    # Minuten später, darum kurz vor der vollen Stunde angesetzt.
    # Im Sommer (ab Ende März) jeweils eine Stunde früher eintragen.
    - cron: "57 8 * * *"   # ca. 10:00 Uhr deutscher Zeit
    - cron: "27 12 * * *"  # ca. 13:30 Uhr
    - cron: "57 15 * * *"  # ca. 17:00 Uhr
    - cron: "57 18 * * *"  # ca. 20:00 Uhr
  workflow_dispatch:       # "Run workflow"-Knopf zum sofortigen Starten
    inputs:
      modus:
        description: "run = erstellen + hochladen, generate = nur Testvideo erstellen"
        type: choice
        options: [run, generate]
        default: run

permissions:
  contents: write          # um den Serien-Fortschritt zu speichern

concurrency:
  group: story-bot
  cancel-in-progress: false

jobs:
  part:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Systembibliotheken
        timeout-minutes: 4
        continue-on-error: true
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1
      - name: Werkzeuge aus Zwischenspeicher
        id: bcache
        uses: actions/cache@v4
        with:
          path: |
            ~/blender
            ~/ffmpeg
          key: tools-blender-4.2.3-ffmpeg-v1
      - name: Blender + ffmpeg herunterladen
        if: steps.bcache.outputs.cache-hit != 'true'
        timeout-minutes: 12
        run: |
          mkdir -p ~/blender ~/ffmpeg
          for url in https://mirrors.ocf.berkeley.edu/blender/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz \
                     https://ftp.halifax.rwth-aachen.de/blender/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz \
                     https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz; do
            echo "Lade $url"
            if curl -fL --retry 2 --connect-timeout 20 --max-time 420 -o /tmp/b.tar.xz "$url"; then break; fi
          done
          tar -xJf /tmp/b.tar.xz -C ~/blender --strip-components=1
          curl -fL --retry 3 --max-time 300 -o /tmp/f.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xJf /tmp/f.tar.xz -C ~/ffmpeg --strip-components=1
      - name: Werkzeuge prüfen
        timeout-minutes: 2
        run: |
          echo "$HOME/blender" >> $GITHUB_PATH
          echo "$HOME/ffmpeg/bin" >> $GITHUB_PATH
          ~/blender/blender -b --factory-startup -noaudio --version | head -1
          ~/ffmpeg/bin/ffmpeg -hide_banner -filters | grep -E " ass " 
      - name: Python-Pakete
        run: pip install -q -r requirements.txt

      - name: Part erstellen und hochladen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REDIRECT_URI: ${{ secrets.TIKTOK_REDIRECT_URI }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TOKENS_JSON: ${{ secrets.TOKENS_JSON }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python src/main.py ${{ inputs.modus || 'run' }}

      - name: Fortschritt speichern
        if: always() && (inputs.modus || 'run') == 'run'
        run: |
          git config user.name "story-bot"
          git config user.email "story-bot@users.noreply.github.com"
          git add series/
          git diff --cached --quiet || git commit -m "Story-Fortschritt $(date -u +%F)"
          git push

      - name: Testvideo im Branch "preview" ablegen
        if: always() && inputs.modus == 'generate'
        run: |
          f=$(ls output/*/part_*/final.mp4 2>/dev/null | head -1)
          [ -z "$f" ] && exit 0
          mkdir -p /tmp/pv && cp "$f" /tmp/pv/final.mp4 && cp "$(dirname $f)/script.json" /tmp/pv/ || true
          ffmpeg -v error -y -i /tmp/pv/final.mp4 -vf "fps=1/3,scale=180:-1,tile=8x4" -frames:v 1 /tmp/pv/sheet.jpg || true
          git config user.name "story-bot"; git config user.email "story-bot@users.noreply.github.com"
          git checkout -q --orphan pv-video && git rm -rfq --cached . && rm -rf preview && mkdir preview && cp /tmp/pv/* preview/
          git add -f preview && git commit -qm "Testvideo" && git push -qf origin pv-video:preview

      - name: Video zum Anschauen bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: output/**/final.mp4
          retention-days: 7
          if-no-files-found: ignore
