name: Story Bot

on:
  schedule:
    # 4x täglich. Zeiten in UTC (Winter: deutsche Zeit -1 h). GitHub startet oft ein paar
    # Minuten später, darum kurz vor der vollen Stunde angesetzt.
    # Im Sommer (ab Ende März) jeweils eine Stunde früher eintragen.
    - cron: "57 8 * * *"   # ca. 10:00 Uhr deutscher Zeit
    - cron: "27 12 * * *"  # ca. 13:30 Uhr
    - cron: "57 15 * * *"  # ca. 17:00 Uhr
    - cron: "57 18 * * *"  # ca. 20:00 Uhr
  workflow_dispatch:       # "Run workflow"-Knopf zum sofortigen Starten
    inputs:
      modus:
        description: "run = erstellen + hochladen, generate = nur Testvideo erstellen"
        type: choice
        options: [run, generate]
        default: run

permissions:
  contents: write          # um den Serien-Fortschritt zu speichern

concurrency:
  group: story-bot
  cancel-in-progress: false

jobs:
  part:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Werkzeuge installieren
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1 > /dev/null
          curl -sL https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz | tar -xJ -C $HOME
          echo "$HOME/blender-4.2.3-linux-x64" >> $GITHUB_PATH
          pip install -q -r requirements.txt

      - name: Part erstellen und hochladen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REDIRECT_URI: ${{ secrets.TIKTOK_REDIRECT_URI }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TOKENS_JSON: ${{ secrets.TOKENS_JSON }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python src/main.py ${{ inputs.modus || 'run' }}

      - name: Fortschritt speichern
        if: always() && (inputs.modus || 'run') == 'run'
        run: |
          git config user.name "story-bot"
          git config user.email "story-bot@users.noreply.github.com"
          git add series/
          git diff --cached --quiet || git commit -m "Story-Fortschritt $(date -u +%F)"
          git push

      - name: Video zum Anschauen bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: output/**/final.mp4
          retention-days: 7
          if-no-files-found: ignore
